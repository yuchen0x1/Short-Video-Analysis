name: 功能建议
description: 描述希望改善的使用流程
body:
  - type: dropdown
    id: client
    attributes:
      label: 适用端
      options: [Windows, 网页/PWA, 两端, API/Docker]
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 使用场景和预期效果
      description: 请说明当前操作、困难和你希望完成的任务。
    validations:
      required: true
