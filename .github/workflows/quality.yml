name: quality

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php:
    name: PHP lint + PHPUnit + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, json, openssl, mbstring, dom, zip
          tools: composer:v2
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Lint
        run: composer lint

      - name: Unit tests
        run: composer test

      - name: Smoke checks
        run: composer smoke

  js-contracts:
    name: JS contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: parsers contract
        working-directory: packages/parsers
        run: npm test

      - name: a_bogus sidecar
        run: node --test scripts/a_bogus_server.test.mjs

      - name: Web workbench regression tests
        run: node --test tests/workbench.test.cjs

  clients:
    name: Desktop build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/app-shell/package-lock.json

      - name: Install desktop deps
        working-directory: apps/app-shell
        run: npm ci

      - name: Build desktop renderer
        working-directory: apps/app-shell
        run: npx vite build --base=./

  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Tracked files and secret patterns
        run: node scripts/check-repository-hygiene.mjs

      - name: Git diff whitespace
        run: git diff --check
