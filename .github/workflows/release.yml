name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build and publish Windows release
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GITHUB_OWNER: yuchen0x1
      GITHUB_REPO: Short-Video-Analysis
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/app-shell/package-lock.json

      - name: Validate release version
        run: node scripts/check-release-version.mjs

      - name: Install desktop dependencies
        working-directory: apps/app-shell
        run: npm ci

      - name: Build Windows installers
        working-directory: apps/app-shell
        run: npm run dist:win

      - name: Prepare release notes
        run: node scripts/prepare-release-notes.mjs $env:RELEASE_TAG .evolution/release-notes.md

      - name: Generate checksum manifest
        run: node scripts/generate-release-manifest.mjs apps/app-shell/release $env:RELEASE_TAG

      - name: Create draft GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$env:RELEASE_TAG" --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = gh release view "$env:RELEASE_TAG" --json isDraft | ConvertFrom-Json
            if (-not $release.isDraft) { throw '该版本已发布，禁止重跑覆盖正式资产' }
            gh release edit "$env:RELEASE_TAG" --notes-file .evolution/release-notes.md
          } else {
            gh release create "$env:RELEASE_TAG" --draft --verify-tag --title "$env:RELEASE_TAG" --notes-file .evolution/release-notes.md
          }

      - name: Upload release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem apps/app-shell/release -File |
            Where-Object { $_.Name -ne 'builder-debug.yml' -and ($_.Name -match '\.(exe|yml|blockmap)$' -or $_.Name -in @('SHA256SUMS.txt', 'update-manifest.json')) } |
            ForEach-Object { $_.FullName }
          if (-not $assets) { throw '没有可上传的发布资产' }
          gh release upload "$env:RELEASE_TAG" @assets --clobber

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$env:RELEASE_TAG" --draft=false --latest
